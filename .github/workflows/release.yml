name: Release

# Pushing a tag vX.Y.Z (matching "version" in package.json) builds the card and publishes a
# GitHub release with variation-bar-card.js attached: HACS installs that file.
# A tag with a pre-release label (vX.Y.Z-beta.N, vX.Y.Z-rc.N…) publishes a pre-release instead:
# HACS only offers it to users who enabled beta versions for the card.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Build + publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/variation-bar-card.js --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag "${flags[@]}"
